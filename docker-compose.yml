services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mangamanager
      POSTGRES_USER: mangamanager
      POSTGRES_PASSWORD: mangamanager
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangamanager -d mangamanager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
